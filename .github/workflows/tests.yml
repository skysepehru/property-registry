name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore "ci~/PropertyRegistry.Tests/PropertyRegistry.Tests.csproj"

      - name: Test
        run: dotnet test "ci~/PropertyRegistry.Tests/PropertyRegistry.Tests.csproj" --configuration Release --logger "console;verbosity=normal"
